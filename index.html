<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diarrhea Data Collection Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ================= COLORS & VARIABLES ================= */
    :root {
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --pink-400: #f472b6;
      --pink-500: #ec4899;
      --orange-400: #fb923c;
      --orange-500: #f97316;
      --red-400: #f87171;
      --red-500: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
      --green-500: #10b981;
      --green-600: #059669;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, var(--blue-50), #e0e7ff, #f0f4ff);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
                  0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .header {
      background-color: #222936;
      padding: 1.5rem 2rem;
      position: relative;
    }

    .header h1 {
      color: white;
      font-size: 1.875rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: #bfdbfe;
    }

    /* Buttons */
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      border: none;
      font-size: 0.875rem;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .btn-primary {
      background-color: var(--blue-500);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--blue-600);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--gray-300);
      color: var(--gray-700);
    }

    .btn-outline:hover {
      background-color: var(--gray-100);
    }

    /* Progress Steps */
    .progress-section {
      padding: 2rem;
      background: linear-gradient(to right, var(--gray-50), rgba(191, 219, 254, 0.3));
    }

    .progress-steps {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding: 0 1rem;
      position: relative;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .step-icon {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-200);
      transition: all 0.3s;
    }

    .step-title {
      margin-top: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-500);
      transition: all 0.3s;
    }

    .step-icon.active { 
      background: var(--blue-500); 
      color: white; 
    }
    
    .step-title.active { 
      color: var(--gray-900); 
      font-weight: 600;
    }

    .step-icon.completed { 
      background: var(--green-500); 
      color: white; 
    }
    
    .step-title.completed { 
      color: var(--gray-900); 
    }

    .step-icon.inactive { 
      background: var(--gray-200); 
      color: var(--gray-500); 
    }
    
    .step-title.inactive { 
      color: var(--gray-500); 
    }

    .step-connector {
      position: absolute;
      height: 4px;
      background: var(--gray-200);
      top: 2rem;
      left: 10%;
      right: 10%;
      z-index: 1;
      transition: all 0.3s;
    }

    .step-connector-fill {
      height: 100%;
      background: var(--green-500);
      width: 0%;
      transition: width 0.5s ease;
    }

    .form-section {
      padding: 2rem;
      min-height: 600px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .mt-6 {
      margin-top: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 0.75rem;
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      padding: 1rem;
      border: 2px solid var(--gray-200);
      border-radius: 0.75rem;
      background: white;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-field:focus, .select-field:focus, .textarea-field:focus {
      outline: none;
      border-color: var(--blue-500);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .textarea-field { 
      resize: none; 
    }

    /* Form step visibility */
    .form-step {
      display: none;
    }

    .form-step.visible {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Navigation buttons */
    .form-navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--gray-200);
    }

    /* Background Decorations */
    .background-decoration {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .decoration-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(3rem);
    }

    .circle-1 {
      width: 20rem;
      height: 20rem;
      top: -10rem;
      right: -10rem;
      background: linear-gradient(to bottom right,
        rgba(59, 130, 246, 0.2),
        rgba(147, 51, 234, 0.2));
    }

    .circle-2 {
      width: 20rem;
      height: 20rem;
      bottom: -10rem;
      left: -10rem;
      background: linear-gradient(to bottom right,
        rgba(244, 114, 182, 0.2),
        rgba(251, 146, 60, 0.2));
    }

    /* Database view */
    .hidden {
      display: none !important;
    }

    .database-view {
      padding: 2rem;
    }

    .database-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 0.75rem;
      border: 1px solid var(--gray-200);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--gray-200);
    }

    th {
      background-color: var(--gray-50);
      font-weight: 600;
      color: var(--gray-700);
    }

    tr:hover {
      background-color: var(--gray-50);
    }

    .dehydration-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .dehydration-none {
      background-color: var(--green-500);
      color: white;
    }

    .dehydration-mild {
      background-color: var(--orange-400);
      color: white;
    }

    .dehydration-severe {
      background-color: var(--red-500);
      color: white;
    }

    .empty-database {
      text-align: center;
      padding: 3rem;
      color: var(--gray-500);
    }

    .empty-icon {
      margin-bottom: 1rem;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background-color: white;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 90%;
      max-height: 90%;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* Save modal */
    .save-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--green-500);
      color: white;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      z-index: 1001;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
  </style>
</head>
<body>
  <div class="background-decoration">
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>
  </div>

  <div class="container">
    <div class="card">
      <!-- Header -->
      <div class="header">
        <h1>Diarrhea Data Collection Form</h1>
        <p>Children Under 5 Months - Mother's Report</p>
        <button id="view-database-btn" class="btn btn-secondary" style="position: absolute; top: 1.5rem; right: 2rem;">
          <i class="fas fa-database"></i> View Database (<span id="record-count">0</span>)
        </button>
      </div>

      <!-- Progress Steps -->
      <div class="progress-section">
        <div class="progress-steps">
          <div class="step-connector">
            <div class="step-connector-fill" id="step-connector-fill"></div>
          </div>
          <div class="step">
            <div class="step-icon active" id="step-1-icon"><i class="fas fa-user"></i></div>
            <span class="step-title active" id="step-1-title">Mother's Info</span>
          </div>
          <div class="step">
            <div class="step-icon" id="step-2-icon"><i class="fas fa-baby"></i></div>
            <span class="step-title" id="step-2-title">Child Info</span>
          </div>
          <div class="step">
            <div class="step-icon" id="step-3-icon"><i class="fas fa-tint"></i></div>
            <span class="step-title" id="step-3-title">Diarrhea</span>
          </div>
          <div class="step">
            <div class="step-icon" id="step-4-icon"><i class="fas fa-exclamation-circle"></i></div>
            <span class="step-title" id="step-4-title">Symptoms</span>
          </div>
        </div>
      </div>

      <!-- Main Form -->
      <div id="main-form">
        <!-- Step 1: Mother's Information -->
        <div class="form-step visible" id="step-1">
          <div class="form-grid">
            <div class="form-group">
              <label for="motherName">Mother's Full Name *</label>
              <input type="text" id="motherName" class="input-field" placeholder="Enter mother's full name" required>
            </div>

            <div class="form-group">
              <label for="motherAge">Age *</label>
              <input type="number" id="motherAge" class="input-field" placeholder="Age in years" required>
            </div>

            <div class="form-group">
              <label for="education">Education Level</label>
              <select id="education" class="select-field">
                <option value="">Select</option>
                <option value="none">No formal education</option>
                <option value="primary">Primary</option>
                <option value="secondary">Secondary</option>
                <option value="tertiary">Tertiary</option>
              </select>
            </div>

            <div class="form-group">
              <label for="phoneNumber">Phone Number</label>
              <input type="tel" id="phoneNumber" class="input-field" placeholder="Enter phone number">
            </div>
          </div>

          <div class="form-group mt-6">
            <label for="address">Address</label>
            <textarea id="address" class="textarea-field" rows="4" placeholder="Enter complete address"></textarea>
          </div>

          <div class="form-navigation">
            <button id="prev-btn" class="btn btn-outline" disabled>
              <i class="fas fa-arrow-left"></i> Previous
            </button>
            <button id="next-btn" class="btn btn-primary">
              Next <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- Step 2: Child Information -->
        <div class="form-step" id="step-2">
          <div class="form-grid">
            <div class="form-group">
              <label for="childName">Child's Full Name *</label>
              <input type="text" id="childName" class="input-field" placeholder="Enter child's full name" required>
            </div>

            <div class="form-group">
              <label for="childAge">Age *</label>
              <div style="display: flex; gap: 1rem;">
                <input type="number" id="childAge" class="input-field" placeholder="Age" required style="flex: 1;">
                <select id="childAgeUnit" class="select-field" style="width: 120px;">
                  <option value="weeks">Weeks</option>
                  <option value="months">Months</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="birthWeight">Birth Weight (kg)</label>
              <input type="number" id="birthWeight" class="input-field" placeholder="Weight in kg" step="0.1">
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender" class="select-field">
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
          </div>

          <div class="form-group mt-6">
            <label for="birthDate">Birth Date</label>
            <input type="date" id="birthDate" class="input-field">
          </div>

          <div class="form-navigation">
            <button id="prev-btn-2" class="btn btn-outline">
              <i class="fas fa-arrow-left"></i> Previous
            </button>
            <button id="next-btn-2" class="btn btn-primary">
              Next <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- Step 3: Diarrhea Details -->
        <div class="form-step" id="step-3">
          <div class="form-grid">
            <div class="form-group">
              <label for="onsetDate">Onset Date *</label>
              <input type="date" id="onsetDate" class="input-field" required>
            </div>

            <div class="form-group">
              <label for="duration">Duration (days) *</label>
              <input type="number" id="duration" class="input-field" placeholder="Number of days" required>
            </div>

            <div class="form-group">
              <label for="frequency">Frequency (per day)</label>
              <input type="number" id="frequency" class="input-field" placeholder="Times per day">
            </div>

            <div class="form-group">
              <label for="consistency">Consistency</label>
              <select id="consistency" class="select-field">
                <option value="">Select</option>
                <option value="watery">Watery</option>
                <option value="loose">Loose</option>
                <option value="mucoid">Mucoid</option>
              </select>
            </div>

            <div class="form-group">
              <label for="color">Color</label>
              <select id="color" class="select-field">
                <option value="">Select</option>
                <option value="yellow">Yellow</option>
                <option value="green">Green</option>
                <option value="brown">Brown</option>
              </select>
            </div>

            <div class="form-group">
              <label for="bloodPresent">Blood Present</label>
              <select id="bloodPresent" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="mucusPresent">Mucus Present</label>
              <select id="mucusPresent" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>
          </div>

          <div class="form-navigation">
            <button id="prev-btn-3" class="btn btn-outline">
              <i class="fas fa-arrow-left"></i> Previous
            </button>
            <button id="next-btn-3" class="btn btn-primary">
              Next <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- Step 4: Symptoms & Treatment -->
        <div class="form-step" id="step-4">
          <div class="form-grid">
            <div class="form-group">
              <label for="fever">Fever</label>
              <select id="fever" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="vomiting">Vomiting</label>
              <select id="vomiting" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="dehydration">Dehydration Signs</label>
              <select id="dehydration" class="select-field">
                <option value="">Select</option>
                <option value="none">None</option>
                <option value="mild">Mild</option>
                <option value="severe">Severe</option>
              </select>
            </div>

            <div class="form-group">
              <label for="lethargy">Lethargy</label>
              <select id="lethargy" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="feedingDifficulty">Feeding Difficulty</label>
              <select id="feedingDifficulty" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="breastfeeding">Breastfeeding</label>
              <select id="breastfeeding" class="select-field">
                <option value="">Select</option>
                <option value="exclusive">Exclusive</option>
                <option value="partial">Partial</option>
                <option value="none">None</option>
              </select>
            </div>

            <div class="form-group">
              <label for="oralRehydration">Oral Rehydration Given</label>
              <select id="oralRehydration" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="hospitalVisit">Hospital Visit</label>
              <select id="hospitalVisit" class="select-field">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>
          </div>

          <div class="form-group mt-6">
            <label for="additionalNotes">Additional Notes</label>
            <textarea id="additionalNotes" class="textarea-field" rows="4" placeholder="Any additional information"></textarea>
          </div>

          <div class="form-navigation">
            <button id="prev-btn-4" class="btn btn-outline">
              <i class="fas fa-arrow-left"></i> Previous
            </button>
            <button id="save-btn" class="btn btn-primary">
              <i class="fas fa-save"></i> Save Record
            </button>
          </div>
        </div>
      </div>

      <!-- Database View -->
      <div id="database-view" class="database-view hidden">
        <div class="database-header">
          <h2>Saved Records (<span id="database-record-count">0</span>)</h2>
          <button id="back-to-form-btn" class="btn btn-primary">
            <i class="fas fa-arrow-left"></i> Back to Form
          </button>
        </div>
        <div id="database-content">
          <div class="empty-database">
            <div class="empty-icon">
              <i class="fas fa-database fa-2x"></i>
            </div>
            <h4>No records found</h4>
            <p>Submit a form to see records here</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Save Success Modal -->
  <div id="save-modal" class="save-modal hidden">
    <i class="fas fa-check-circle"></i>
    <span>Record saved successfully!</span>
  </div>

  <script>
    // Application state
    let currentStep = 1;
    let savedRecords = JSON.parse(localStorage.getItem('diarrheaRecords')) || [];
    let isAnimating = false;

    // Form data object
    const formData = {
        motherName: '',
        motherAge: '',
        education: '',
        phoneNumber: '',
        address: '',
        childName: '',
        childAge: '',
        childAgeUnit: 'weeks',
        birthWeight: '',
        gender: '',
        birthDate: '',
        onsetDate: '',
        duration: '',
        frequency: '',
        consistency: '',
        color: '',
        bloodPresent: '',
        mucusPresent: '',
        fever: '',
        vomiting: '',
        dehydration: '',
        lethargy: '',
        feedingDifficulty: '',
        breastfeeding: '',
        oralRehydration: '',
        hospitalVisit: '',
        additionalNotes: ''
    };

    // DOM Elements
    const stepElements = {
        1: document.getElementById('step-1'),
        2: document.getElementById('step-2'),
        3: document.getElementById('step-3'),
        4: document.getElementById('step-4')
    };

    const stepIcons = {
        1: document.getElementById('step-1-icon'),
        2: document.getElementById('step-2-icon'),
        3: document.getElementById('step-3-icon'),
        4: document.getElementById('step-4-icon')
    };

    const stepTitles = {
        1: document.getElementById('step-1-title'),
        2: document.getElementById('step-2-title'),
        3: document.getElementById('step-3-title'),
        4: document.getElementById('step-4-title')
    };

    const stepConnectorFill = document.getElementById('step-connector-fill');
    
    const prevBtns = {
        1: document.getElementById('prev-btn'),
        2: document.getElementById('prev-btn-2'),
        3: document.getElementById('prev-btn-3'),
        4: document.getElementById('prev-btn-4')
    };

    const nextBtns = {
        1: document.getElementById('next-btn'),
        2: document.getElementById('next-btn-2'),
        3: document.getElementById('next-btn-3')
    };

    const saveBtn = document.getElementById('save-btn');
    const viewDatabaseBtn = document.getElementById('view-database-btn');
    const backToFormBtn = document.getElementById('back-to-form-btn');
    const mainForm = document.getElementById('main-form');
    const databaseView = document.getElementById('database-view');
    const saveModal = document.getElementById('save-modal');
    const recordCountElements = document.querySelectorAll('#record-count, #database-record-count');
    const databaseContent = document.getElementById('database-content');

    // Initialize the application
    function init() {
        updateRecordCount();
        updateNavigationButtons();
        updateProgressIndicator();
        
        // Add event listeners
        Object.keys(prevBtns).forEach(step => {
            prevBtns[step].addEventListener('click', () => goToPreviousStep());
        });
        
        Object.keys(nextBtns).forEach(step => {
            nextBtns[step].addEventListener('click', () => goToNextStep());
        });
        
        saveBtn.addEventListener('click', saveFormData);
        viewDatabaseBtn.addEventListener('click', showDatabaseView);
        backToFormBtn.addEventListener('click', showFormView);
        
        // Add input event listeners to save data as user types
        addInputEventListeners();
    }

    // Add input event listeners to all form fields
    function addInputEventListeners() {
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                formData[this.id] = this.value;
            });
            
            input.addEventListener('change', function() {
                formData[this.id] = this.value;
            });
        });
    }

    // Update the progress indicator
    function updateProgressIndicator() {
        // Update step icons and titles
        for (let i = 1; i <= 4; i++) {
            if (i < currentStep) {
                stepIcons[i].className = 'step-icon completed';
                stepIcons[i].innerHTML = '<i class="fas fa-check"></i>';
                stepTitles[i].className = 'step-title completed';
            } else if (i === currentStep) {
                stepIcons[i].className = 'step-icon active';
                stepTitles[i].innerHTML = stepTitles[i].innerHTML.replace(/<i.*?<\/i>/, '').trim();
                stepTitles[i].className = 'step-title active';
            } else {
                stepIcons[i].className = 'step-icon inactive';
                stepTitles[i].className = 'step-title inactive';
            }
        }
        
        // Update connector fill
        const fillPercentage = ((currentStep - 1) / 3) * 100;
        stepConnectorFill.style.width = `${fillPercentage}%`;
    }

    // Update navigation buttons based on current step
    function updateNavigationButtons() {
        // Enable/disable previous buttons
        Object.keys(prevBtns).forEach(step => {
            if (parseInt(step) === 1) {
                prevBtns[step].disabled = true;
                prevBtns[step].style.opacity = '0.5';
            } else {
                prevBtns[step].disabled = false;
                prevBtns[step].style.opacity = '1';
            }
        });
    }

    // Show a specific step
    function showStep(stepNumber) {
        if (isAnimating || stepNumber < 1 || stepNumber > 4) return;
        
        isAnimating = true;
        
        // Hide all steps first
        for (let i = 1; i <= 4; i++) {
            stepElements[i].classList.remove('visible');
        }
        
        // Show new step after a short delay
        setTimeout(() => {
            currentStep = stepNumber;
            stepElements[currentStep].classList.add('visible');
            
            updateProgressIndicator();
            updateNavigationButtons();
            
            isAnimating = false;
        }, 300);
    }

    // Go to the next step
    function goToNextStep() {
        if (currentStep < 4) {
            // Validate current step before proceeding
            if (validateCurrentStep()) {
                showStep(currentStep + 1);
            }
        }
    }

    // Go to the previous step
    function goToPreviousStep() {
        if (currentStep > 1) {
            showStep(currentStep - 1);
        }
    }

    // Validate the current step
    function validateCurrentStep() {
        let isValid = true;
        const currentStepElement = stepElements[currentStep];
        const requiredFields = currentStepElement.querySelectorAll('[required]');
        
        requiredFields.forEach(field => {
            if (!field.value.trim()) {
                isValid = false;
                field.style.borderColor = 'var(--red-500)';
                field.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.1)';
                
                // Remove error styling when user starts typing
                const removeError = function() {
                    this.style.borderColor = 'var(--gray-200)';
                    this.style.boxShadow = 'none';
                    this.removeEventListener('input', removeError);
                };
                field.addEventListener('input', removeError);
            }
        });
        
        if (!isValid) {
            // Show error animation
            currentStepElement.style.animation = 'none';
            setTimeout(() => {
                currentStepElement.style.animation = 'shake 0.5s ease-in-out';
            }, 10);
        }
        
        return isValid;
    }

    // Save form data to localStorage
    function saveFormData() {
        if (validateCurrentStep()) {
            // Create a unique ID for the record
            const recordId = Date.now().toString();
            
            // Create the record object
            const record = {
                id: recordId,
                timestamp: new Date().toISOString(),
                ...formData
            };
            
            // Add to saved records
            savedRecords.push(record);
            
            // Save to localStorage
            localStorage.setItem('diarrheaRecords', JSON.stringify(savedRecords));
            
            // Update record count
            updateRecordCount();
            
            // Show success modal
            showSaveModal();
            
            // Reset form after a delay
            setTimeout(() => {
                resetForm();
                showStep(1);
            }, 2000);
        }
    }

    // Show the save success modal
    function showSaveModal() {
        saveModal.classList.remove('hidden');
        
        setTimeout(() => {
            saveModal.classList.add('hidden');
        }, 2000);
    }

    // Reset the form
    function resetForm() {
        // Clear all form fields
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.value = '';
        });
        
        // Reset form data object
        Object.keys(formData).forEach(key => {
            formData[key] = '';
        });
        
        // Reset child age unit to default
        document.getElementById('childAgeUnit').value = 'weeks';
        formData.childAgeUnit = 'weeks';
    }

    // Update the record count display
    function updateRecordCount() {
        const count = savedRecords.length;
        recordCountElements.forEach(element => {
            element.textContent = count;
        });
    }

    // Show the database view
    function showDatabaseView() {
        mainForm.classList.add('hidden');
        databaseView.classList.remove('hidden');
        renderDatabaseTable();
    }

    // Show the form view
    function showFormView() {
        databaseView.classList.add('hidden');
        mainForm.classList.remove('hidden');
        showStep(1);
    }

    // Render the database table
    function renderDatabaseTable() {
        if (savedRecords.length === 0) {
            databaseContent.innerHTML = `
                <div class="empty-database">
                    <div class="empty-icon">
                        <i class="fas fa-database fa-2x"></i>
                    </div>
                    <h4>No records found</h4>
                    <p>Submit a form to see records here</p>
                </div>
            `;
            return;
        }
                // Create the table
        const tableHTML = `
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Mother's Name</th>
                            <th>Child's Name</th>
                            <th>Child Age</th>
                            <th>Onset Date</th>
                            <th>Duration</th>
                            <th>Dehydration</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${savedRecords.map(record => `
                            <tr>
                                <td>${record.motherName || 'N/A'}</td>
                                <td>${record.childName || 'N/A'}</td>
                                <td>${record.childAge ? `${record.childAge} ${record.childAgeUnit}` : 'N/A'}</td>
                                <td>${record.onsetDate ? new Date(record.onsetDate).toLocaleDateString() : 'N/A'}</td>
                                <td>${record.duration ? `${record.duration} days` : 'N/A'}</td>
                                <td>
                                    <span class="dehydration-badge dehydration-${record.dehydration || 'none'}">
                                        ${record.dehydration ? record.dehydration.charAt(0).toUpperCase() + record.dehydration.slice(1) : 'None'}
                                    </span>
                                </td>
                                <td>
                                    <button class="btn btn-outline view-record" data-id="${record.id}">
                                        <i class="fas fa-eye"></i> View
                                    </button>
                                    <button class="btn btn-outline delete-record" data-id="${record.id}">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        
        databaseContent.innerHTML = tableHTML;
        
        // Add event listeners to the action buttons
        databaseContent.querySelectorAll('.view-record').forEach(button => {
            button.addEventListener('click', function() {
                const recordId = this.getAttribute('data-id');
                viewRecord(recordId);
            });
        });
        
        databaseContent.querySelectorAll('.delete-record').forEach(button => {
            button.addEventListener('click', function() {
                const recordId = this.getAttribute('data-id');
                deleteRecord(recordId);
            });
        });
    }

    // View a single record
    function viewRecord(recordId) {
        const record = savedRecords.find(r => r.id === recordId);
        if (!record) return;
        
        const modalContent = `
            <div class="modal-content">
                <h2>Record Details</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem;">
                    <div>
                        <h3>Mother's Information</h3>
                        <p><strong>Name:</strong> ${record.motherName || 'N/A'}</p>
                        <p><strong>Age:</strong> ${record.motherAge || 'N/A'}</p>
                        <p><strong>Education:</strong> ${record.education ? record.education.charAt(0).toUpperCase() + record.education.slice(1) : 'N/A'}</p>
                        <p><strong>Phone:</strong> ${record.phoneNumber || 'N/A'}</p>
                        <p><strong>Address:</strong> ${record.address || 'N/A'}</p>
                    </div>
                    <div>
                        <h3>Child's Information</h3>
                        <p><strong>Name:</strong> ${record.childName || 'N/A'}</p>
                        <p><strong>Age:</strong> ${record.childAge ? `${record.childAge} ${record.childAgeUnit}` : 'N/A'}</p>
                        <p><strong>Birth Weight:</strong> ${record.birthWeight ? `${record.birthWeight} kg` : 'N/A'}</p>
                        <p><strong>Gender:</strong> ${record.gender ? record.gender.charAt(0).toUpperCase() + record.gender.slice(1) : 'N/A'}</p>
                        <p><strong>Birth Date:</strong> ${record.birthDate ? new Date(record.birthDate).toLocaleDateString() : 'N/A'}</p>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem;">
                    <div>
                        <h3>Diarrhea Details</h3>
                        <p><strong>Onset Date:</strong> ${record.onsetDate ? new Date(record.onsetDate).toLocaleDateString() : 'N/A'}</p>
                        <p><strong>Duration:</strong> ${record.duration ? `${record.duration} days` : 'N/A'}</p>
                        <p><strong>Frequency:</strong> ${record.frequency ? `${record.frequency} times/day` : 'N/A'}</p>
                        <p><strong>Consistency:</strong> ${record.consistency ? record.consistency.charAt(0).toUpperCase() + record.consistency.slice(1) : 'N/A'}</p>
                        <p><strong>Color:</strong> ${record.color ? record.color.charAt(0).toUpperCase() + record.color.slice(1) : 'N/A'}</p>
                        <p><strong>Blood Present:</strong> ${record.bloodPresent ? record.bloodPresent.charAt(0).toUpperCase() + record.bloodPresent.slice(1) : 'N/A'}</p>
                        <p><strong>Mucus Present:</strong> ${record.mucusPresent ? record.mucusPresent.charAt(0).toUpperCase() + record.mucusPresent.slice(1) : 'N/A'}</p>
                    </div>
                    <div>
                        <h3>Symptoms & Treatment</h3>
                        <p><strong>Fever:</strong> ${record.fever ? record.fever.charAt(0).toUpperCase() + record.fever.slice(1) : 'N/A'}</p>
                        <p><strong>Vomiting:</strong> ${record.vomiting ? record.vomiting.charAt(0).toUpperCase() + record.vomiting.slice(1) : 'N/A'}</p>
                        <p><strong>Dehydration:</strong> ${record.dehydration ? record.dehydration.charAt(0).toUpperCase() + record.dehydration.slice(1) : 'N/A'}</p>
                        <p><strong>Lethargy:</strong> ${record.lethargy ? record.lethargy.charAt(0).toUpperCase() + record.lethargy.slice(1) : 'N/A'}</p>
                        <p><strong>Feeding Difficulty:</strong> ${record.feedingDifficulty ? record.feedingDifficulty.charAt(0).toUpperCase() + record.feedingDifficulty.slice(1) : 'N/A'}</p>
                        <p><strong>Breastfeeding:</strong> ${record.breastfeeding ? record.breastfeeding.charAt(0).toUpperCase() + record.breastfeeding.slice(1) : 'N/A'}</p>
                        <p><strong>Oral Rehydration:</strong> ${record.oralRehydration ? record.oralRehydration.charAt(0).toUpperCase() + record.oralRehydration.slice(1) : 'N/A'}</p>
                        <p><strong>Hospital Visit:</strong> ${record.hospitalVisit ? record.hospitalVisit.charAt(0).toUpperCase() + record.hospitalVisit.slice(1) : 'N/A'}</p>
                    </div>
                </div>
                
                ${record.additionalNotes ? `
                    <div style="margin-top: 1.5rem;">
                        <h3>Additional Notes</h3>
                        <p>${record.additionalNotes}</p>
                    </div>
                ` : ''}
                
                <div style="margin-top: 2rem; text-align: right;">
                    <button class="btn btn-primary" id="close-modal-btn">
                        Close
                    </button>
                </div>
            </div>
        `;
        
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = modalContent;
        document.body.appendChild(modal);
        
        // Add event listener to close button
        modal.querySelector('#close-modal-btn').addEventListener('click', () => {
            document.body.removeChild(modal);
        });
        
        // Close modal when clicking outside
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                document.body.removeChild(modal);
            }
        });
    }

    // Delete a record
    function deleteRecord(recordId) {
        if (confirm('Are you sure you want to delete this record? This action cannot be undone.')) {
            savedRecords = savedRecords.filter(record => record.id !== recordId);
            localStorage.setItem('diarrheaRecords', JSON.stringify(savedRecords));
            updateRecordCount();
            renderDatabaseTable();
        }
    }

    // Initialize the application when the DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
